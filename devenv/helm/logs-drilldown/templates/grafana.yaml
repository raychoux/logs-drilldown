apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logs-drilldown.fullname" . }}-grafana
  labels:
    {{- include "logs-drilldown.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "logs-drilldown.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "logs-drilldown.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/provisioning: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum }}
        checksum/dashboard: {{ include (print $.Template.BasePath "/dashboard.yaml") . | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_DEFAULT_APP_MODE
              value: development
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: {{ .Values.grafana.rootUrl | quote }}
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: grafana-lokiexplore-app
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: accessControlOnCall lokiLogsDataplane kubernetesLogsDrilldown localizationForPlugins
            - name: GF_FEATURE_TOGGLES_grafanaAdvisor
              value: "false"
            - name: GF_LOG_FILTERS
              value: plugin.grafana-lokiexplore-app:debug
            - name: GF_LOG_LEVEL
              value: debug
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/plugins/apps.yaml
              subPath: apps.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/pod-monitor.json
              subPath: pod-monitor.json
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "logs-drilldown.fullname" . }}-grafana-provisioning
        - name: dashboard
          configMap:
            name: {{ include "logs-drilldown.fullname" . }}-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logs-drilldown.fullname" . }}-grafana
  labels:
    {{- include "logs-drilldown.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: LoadBalancer
  selector:
    {{- include "logs-drilldown.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3001
      targetPort: http
