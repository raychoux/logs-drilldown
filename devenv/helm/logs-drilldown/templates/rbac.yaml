apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logs-drilldown.fullname" . }}-prometheus
  labels:
    {{- include "logs-drilldown.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "logs-drilldown.fullname" . }}-prometheus
  labels:
    {{- include "logs-drilldown.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "logs-drilldown.fullname" . }}-prometheus
  labels:
    {{- include "logs-drilldown.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "logs-drilldown.fullname" . }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "logs-drilldown.fullname" . }}-prometheus
    namespace: {{ .Release.Namespace }}
