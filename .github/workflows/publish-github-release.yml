# Builds and attaches the distributable plugin archive to the draft release
# created by Release Please. Forks that push tags manually get a draft release
# automatically. The tag must match package.json, with an optional -kone suffix,
# numeric revision, or dated revision (for example, v2.5.1-kone-20260826-01).
name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify release tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          base_tag="v${package_version}"
          kone_tag_pattern="^v${package_version//./\\.}-kone(\\.[1-9][0-9]*|-[0-9]{8}-(0[1-9]|[1-9][0-9]))?$"
          if [[ "${GITHUB_REF_NAME}" != "${base_tag}" && ! "${GITHUB_REF_NAME}" =~ ${kone_tag_pattern} ]]; then
            echo "Tag ${GITHUB_REF_NAME} must be ${base_tag}, ${base_tag}-kone, ${base_tag}-kone.<revision>, or ${base_tag}-kone-YYYYMMDD-NN." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      # This fork distributes a customized build of an existing public plugin.
      # Grafana's catalog validator rejects the upstream version even though the
      # archive is intended only for this fork's GitHub Release.
      - name: Sign plugin when token is configured
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [[ -n "${GRAFANA_ACCESS_POLICY_TOKEN}" ]]; then
            pnpm run sign
          else
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not configured; packaging an unsigned plugin."
          fi

      - name: Package plugin
        id: package
        run: |
          plugin_id=$(node -p "require('./dist/plugin.json').id")
          plugin_version=$(node -p "require('./dist/plugin.json').info.version")
          archive="${plugin_id}-${plugin_version}.zip"
          checksum="${archive}.sha1"

          mv dist "${plugin_id}"
          zip -r "${archive}" "${plugin_id}"
          sha1sum "${archive}" | cut -d' ' -f1 > "${checksum}"

          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "archive-sha1sum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "plugin-id=${plugin_id}" >> "${GITHUB_OUTPUT}"
          echo "plugin-version=${plugin_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag matches plugin version
        env:
          PLUGIN_VERSION: ${{ steps.package.outputs.plugin-version }}
        run: |
          base_tag="v${PLUGIN_VERSION}"
          kone_tag_pattern="^v${PLUGIN_VERSION//./\\.}-kone(\\.[1-9][0-9]*|-[0-9]{8}-(0[1-9]|[1-9][0-9]))?$"
          if [[ "${GITHUB_REF_NAME}" != "${base_tag}" && ! "${GITHUB_REF_NAME}" =~ ${kone_tag_pattern} ]]; then
            echo "Tag ${GITHUB_REF_NAME} must be ${base_tag}, ${base_tag}-kone, ${base_tag}-kone.<revision>, or ${base_tag}-kone-YYYYMMDD-NN." >&2
            exit 1
          fi

      - name: Attest plugin archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
          PLUGIN_ARCHIVE_SHA1: ${{ steps.package.outputs.archive-sha1sum }}
        run: |
          upload_assets() {
            gh release upload "${GITHUB_REF_NAME}" \
              "${PLUGIN_ARCHIVE}" \
              "${PLUGIN_ARCHIVE_SHA1}" \
              --clobber
          }

          for attempt in {1..12}; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              upload_assets
              exit 0
            fi

            echo "Waiting for Release Please to create ${GITHUB_REF_NAME} (attempt ${attempt}/12)..."
            sleep 5
          done

          echo "No existing release found; creating draft ${GITHUB_REF_NAME} for this fork."
          if ! gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"; then
            # A concurrent release creator may have won the race.
            gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi

          upload_assets
