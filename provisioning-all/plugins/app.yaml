apiVersion: 1

# Run Logs, Metrics, and Traces
# Assumes the plugins are in adjacent directories:
# - ../metrics-drilldown/dist
# - ../traces-drilldown/dist
# Used only by pnpm run start:all (docker-compose-local-all.yaml)
# For logs only, use pnpm run start (docker-compose.local.yaml)
apps:
  - type: 'grafana-lokiexplore-app'
    org_id: 1
    org_name: 'Grafana'
    disabled: false
    jsonData:
      apiUrl: http://default-url.com
      isApiKeySet: true
      dashboardRules:
        - title: Pod overview
          field: pod
          fieldMatch: contains
          requiredFields:
            - container
            - namespace
            - pod
            - cluster
          source: indexed-or-structured
          dashboardUrl: /d/grafana-lokiexplore-pod-monitor/pod-monitor?view=overview&var-pod={{value}}&var-pod_query={{logQuery}}&var-namespace={{fields.namespace}}&var-cluster={{fields.cluster}}&var-ds={{datasource}}
        - title: Pod diagnostics
          field: pod
          fieldMatch: contains
          requiredFields:
            - container
            - namespace
            - pod
            - cluster
          source: indexed-or-structured
          dashboardUrl: /d/grafana-lokiexplore-pod-monitor/pod-monitor?view=diagnostics&var-pod={{value}}&var-pod_query={{logQuery}}&var-namespace={{fields.namespace}}&var-cluster={{fields.cluster}}&var-ds={{datasource}}
    secureJsonData:
      apiKey: secret-key
  - type: 'grafana-metricsdrilldown-app'
    org_id: 1
    org_name: 'Grafana'
    disabled: false
    jsonData:
      apiUrl: http://default-url.com
      isApiKeySet: true
    secureJsonData:
      apiKey: secret-key
  - type: 'grafana-exploretraces-app'
    org_id: 1
    org_name: 'Grafana'
    disabled: false
    jsonData:
      apiUrl: http://default-url.com
      isApiKeySet: true
    secureJsonData:
      apiKey: secret-key
